<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="./style.css">
    <title>TRAVELET</title>
    <style>
        .phone-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: #fdfdfd;
        }

        .phone-frame {
            width: 375px;
            height: 750px;
            border: 12px solid #1a1a1b;
            border-radius: 40px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            padding-top: 25px;
            /* Space for the notch */
        }

        /* Adjusted Notch: smaller and further up */
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 18px;
            background: #1a1a1b;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 20;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .description-box {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <?xml version="1.0" encoding="UTF-8"?>
    <svg width="15px" height="15px" id="backbtn" viewBox="0 0 24 24" stroke-width="2.1" fill="none"
        xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" color="#000000">
        <a xlink:href="./index.html">
            <path d="M21 12L3 12M3 12L11.5 3.5M3 12L11.5 20.5" stroke="#000000" stroke-width="2.1"
                stroke-linecap="round" stroke-linejoin="round"></path>
        </a>
    </svg>

    <div class="description-box">
        <div class="left title" style="display: block; text-align: left;">travelet</div>
        <div class="left info" style="text-align: left;">Travelet is a universal mobile application designed to simplify
            the organization of travel documents and customs declarations. Built with React Native and Expo, it features
            a gesture-driven UI and offline-first persistence. The viewport below simulates the mobile experience.</div>
    </div>

    <div class="phone-wrapper">
        <div class="phone-frame">
            <iframe src="./travelet-app/(tabs)/index.html"></iframe>
        </div>
    </div>

</body>

</html>
